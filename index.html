<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aroastotle CAFE - Loyalty Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@1,600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --card-bg: #181818;
            --gold-light: #f5d77f;
            --gold-main: #d4af37;
            --gold-dark: #aa820a;
            --text-gold: #e5c158;
            --text-light: #e0e0e0;
            --text-dim: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 380px;
            background: linear-gradient(145deg, #1c1c1c, #121212);
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 2px rgba(212, 175, 55, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .establishment-tag {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            color: var(--gold-main);
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        /* Clean Logo Container without circle frame */
        .logo-container {
            width: 150px;
            height: auto;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-img {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 50%; /* Keeps image smooth if background is dark */
        }

        /* Customer Info Bar */
        .info-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .customer-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-light);
        }

        .card-id {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .nfc-badge {
            font-size: 0.6rem;
            color: var(--gold-light);
            border: 1px solid var(--gold-dark);
            padding: 2px 6px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Stamps Grid */
        .stamps-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            width: 100%;
            margin-bottom: 25px;
        }

        .stamp-slot {
            aspect-ratio: 1;
            border-radius: 50%;
            border: 1px dashed rgba(212, 175, 55, 0.3);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-dim);
            position: relative;
            transition: all 0.3s ease;
        }

        .stamp-slot.stamped {
            border: 1px solid var(--gold-main);
            background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 0%, rgba(0,0,0,0.4) 100%);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .stamp-icon {
            width: 60%;
            height: 60%;
            object-fit: contain;
            display: none;
        }

        .stamp-slot.stamped .stamp-icon {
            display: block;
        }

        .stamp-slot.stamped .slot-number {
            display: none;
        }

        .stamp-slot.reward-slot {
            border: 1px dashed var(--gold-main);
        }

        .stamp-slot.reward-slot .slot-number {
            color: var(--gold-main);
            font-weight: bold;
        }

        /* Reward Description */
        .reward-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .reward-title {
            font-size: 0.75rem;
            color: var(--text-gold);
            margin-bottom: 4px;
        }

        /* Interactive Controls for Demo */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .btn-reset {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--text-dim);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- BRAND HEADER -->
        <div class="brand-header">
            <div class="establishment-tag">Est. 2026</div>
            <div class="logo-container">
                <!-- Check filename matches your uploaded file (e.g. 41265_2.jpg or logo.jpg) -->
                <img src="logo.jpg" alt="aroastotle philosopher logo" class="logo-img">
            </div>
        </div>

        <!-- CUSTOMER DETAILS -->
        <div class="info-bar">
            <div>
                <div class="customer-name">Valued Customer</div>
                <div class="card-id">NFC ID: #ARO-882026</div>
            </div>
            <div class="nfc-badge">
                📡 NFC READY
            </div>
        </div>

        <!-- STAMPS GRID (10 Slots) -->
        <div class="stamps-grid" id="stampsGrid">
            <!-- Slots 1 to 9 -->
            <div class="stamp-slot stamped"><span class="slot-number">1</span><span class="stamp-icon">☕</span></div>
            <div class="stamp-slot"><span class="slot-number">2</span><span class="stamp-icon">☕</span></div>
            <div class="stamp-slot"><span class="slot-number">3</span><span class="stamp-icon">☕</span></div>
            <div class="stamp-slot"><span class="slot-number">4</span><span class="stamp-icon">☕</span></div>
            <div class="stamp-slot"><span class="slot-number">5</span><span class="stamp-icon">☕</span></div>
            <div class="stamp-slot"><span class="slot-number">6</span><span class="stamp-icon">☕</span></div>
            <div class="stamp-slot"><span class="slot-number">7</span><span class="stamp-icon">☕</span></div>
            <div class="stamp-slot"><span class="slot-number">8</span><span class="stamp-icon">☕</span></div>
            <div class="stamp-slot"><span class="slot-number">9</span><span class="stamp-icon">☕</span></div>
            <!-- Slot 10 (Reward) -->
            <div class="stamp-slot reward-slot"><span class="slot-number">🎁</span><span class="stamp-icon">🎉</span></div>
        </div>

        <!-- REWARD FOOTER -->
        <div class="reward-info">
            <div class="reward-title">Collect 10 stamps to get Hot and Iced Coffee & Matcha series</div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="controls">
            <button class="btn" onclick="addStamp()">TAP TO ADD STAMPS (+)</button>
            <button class="btn btn-reset" onclick="resetStamps()">RESET CARD</button>
        </div>
    </div>

    <script>
        let currentStamps = 1;
        const totalSlots = 10;

        function updateCard() {
            const slots = document.querySelectorAll('.stamp-slot');
            slots.forEach((slot, index) => {
                if (index < currentStamps) {
                    slot.classList.add('stamped');
                } else {
                    slot.classList.remove('stamped');
                }
            });
        }

        function addStamp() {
            if (currentStamps < totalSlots) {
                currentStamps++;
                updateCard();
            } else {
                alert("Congratulations! You've earned a free drink!");
            }
        }

        function resetStamps() {
            currentStamps = 0;
            updateCard();
        }
    </script>
</body>
</html>
