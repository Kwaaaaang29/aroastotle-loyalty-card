<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aroastotle CAFE - Loyalty Card</title>

  <!-- Google Fonts for Brand Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@600;700&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-black: #080808;
      --card-bg: #121212;
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #996515 100%);
      --gold-glow: rgba(212, 175, 55, 0.3);
      --text-white: #ffffff;
      --text-muted: #a0a0a0;
      --border-dark: #262626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* Loyalty Card Container */
    .loyalty-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 400px;
      border-radius: 24px;
      border: 1px solid #2e2a1d;
      padding: 28px 22px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 15px rgba(212, 175, 55, 0.08);
      text-align: center;
      position: relative;
    }

    /* Brand Header Section */
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 22px;
    }

    .establishment-tag {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 2.5px;
      color: var(--gold-primary);
      text-transform: uppercase;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .logo-frame {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      padding: 4px;
      box-shadow: 0 0 15px var(--gold-glow);
      background-color: #000;
      margin-bottom: 10px;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      filter: sepia(100%) hue-rotate(15deg) saturate(300%) contrast(150%);
    }

    .brand-title {
      font-family: 'Pacifico', cursive;
      font-size: 34px;
      color: var(--gold-primary);
      margin-bottom: 2px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .brand-subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--gold-primary);
      letter-spacing: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .brand-subtitle::before,
    .brand-subtitle::after {
      content: "";
      height: 1px;
      flex: 0 1 35px;
      background-color: var(--gold-primary);
    }

    /* Customer Info & Status */
    .customer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-dark);
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .customer-info {
      text-align: left;
    }

    .customer-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-white);
    }

    .card-number {
      font-size: 10px;
      color: var(--text-muted);
    }

    .nfc-tag {
      font-size: 10px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      padding: 4px 8px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* 10 Stamp Grid */
    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .stamp-slot {
      aspect-ratio: 1;
      border: 1.5px dashed #3a3a3a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #666;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      background: #0d0d0d;
    }

    .stamp-slot:hover {
      border-color: var(--gold-primary);
      transform: scale(1.05);
    }

    .stamp-slot.stamped {
      border-style: solid;
      border-color: var(--gold-primary);
      background: radial-gradient(circle, rgba(212, 175, 55, 0.3) 0%, rgba(18, 18, 18, 1) 80%);
      color: var(--gold-primary);
      box-shadow: 0 0 10px var(--gold-glow);
    }

    .stamp-slot.reward-slot {
      border-color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.05);
    }

    /* Rewards Description Line */
    .reward-desc {
      font-size: 11px;
      color: var(--gold-primary);
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
      padding: 0 8px;
    }
<img src="data:image/webp;base64,UklGRqJWAABXRUJQVlA4IJZWAABQGAGdASoAAgACPm02l0gkIyIhJfT5iIANiU3caHz43j0WIGv6BSq7/Vf3T+wd39kTy/9
    /* Actions & Controls */
    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.8px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: all 0.2s ease;
    }

    .btn-gold {
      background: var(--gold-gradient);
      color: #000;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
    }

    .btn-gold:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-dark);
    }

    .btn-outline:hover {
      border-color: #555;
      color: #fff;
    }

    /* Barista Add-Stamp Modal */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(5px);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-title {
      font-family: 'Cinzel', serif;
      color: var(--gold-primary);
      font-size: 18px;
      margin-bottom: 6px;
    }

    .modal-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* Counter Controls */
    .counter-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .counter-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--gold-primary);
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold-primary);
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .counter-btn:active {
      background: var(--gold-primary);
      color: #000;
    }

    .counter-value {
      font-size: 28px;
      font-weight: bold;
      color: #fff;
      min-width: 40px;
    }

    /* Password Input */
    .pin-input {
      background: #1a1a1a;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      padding: 10px;
      color: var(--gold-primary);
      font-size: 16px;
      text-align: center;
      width: 100%;
      max-width: 200px;
      letter-spacing: 6px;
      margin-bottom: 8px;
      outline: none;
    }

    .pin-input:focus {
      border-color: var(--gold-primary);
    }

    .pin-hint {
      font-size: 10px;
      color: #666;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .modal-actions .btn {
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <div class="loyalty-card">
    
    <!-- BRAND HEADER -->
    <div class="brand-header">
      <div class="establishment-tag">Est. 2026</div>
      <div class="logo-frame">
        <img src="logo.jpg" alt="aroastotle philosopher logo" class="logo-img">
      </div>
      <div class="brand-title">aroastotle</div>
      <div class="brand-subtitle">CAFE</div>
    </div>

    <!-- CUSTOMER CARD BAR -->
    <div class="customer-bar">
      <div class="customer-info">
        <div class="customer-name">Valued Customer</div>
        <div class="card-number">NFC ID: #ARO-882026</div>
      </div>
      <div class="nfc-tag">📡 NFC READY</div>
    </div>

    <!-- 10 STAMPS GRID -->
    <div class="stamp-grid" id="stampGrid">
      <!-- Generated via JavaScript -->
    </div>

    <!-- STAMP REQUIREMENT DESCRIPTION -->
    <div class="reward-desc">
      Collect 10 stamps to get Hot and Iced Coffee & Matcha series
    </div>

    <!-- MAIN BUTTONS -->
    <button class="btn btn-gold" onclick="openBaristaModal()">TAP TO ADD STAMPS (+)</button>
    <button class="btn btn-outline" onclick="resetCard()">RESET CARD</button>

    <!-- BARISTA MULTI-DRINK MODAL (PASSWORD PROTECTED) -->
    <div class="modal-overlay" id="baristaModal">
      <div class="modal-title">BARISTA STAMP MODE</div>
      <div class="modal-sub">Select number of drinks purchased</div>

      <div class="counter-wrapper">
        <button class="counter-btn" onclick="adjustCount(-1)">-</button>
        <div class="counter-value" id="drinkCount">1</div>
        <button class="counter-btn" onclick="adjustCount(1)">+</button>
      </div>

      <input type="password" id="baristaPin" class="pin-input" maxlength="4" placeholder="••••" />
      <div class="pin-hint">Enter Barista Password (Default: 1234)</div>

      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeBaristaModal()">CANCEL</button>
        <button class="btn btn-gold" onclick="confirmStamps()">CONFIRM STAMPS</button>
      </div>
    </div>

  </div>

  <script>
    const MAX_STAMPS = 10;
    const DEFAULT_PIN = "1234";
    let currentStamps = 1;
    let selectedDrinks = 1;

    function renderStamps() {
      const grid = document.getElementById('stampGrid');
      grid.innerHTML = '';

      for (let i = 1; i <= MAX_STAMPS; i++) {
        const slot = document.createElement('div');
        slot.className = 'stamp-slot';

        if (i <= currentStamps) {
          slot.classList.add('stamped');
          slot.innerHTML = '☕';
        } else {
          slot.textContent = i === MAX_STAMPS ? '🎁' : i;
        }

        if (i === MAX_STAMPS) {
          slot.classList.add('reward-slot');
        }

        slot.onclick = () => openBaristaModal();
        grid.appendChild(slot);
      }
    }

    function openBaristaModal() {
      selectedDrinks = 1;
      document.getElementById('drinkCount').textContent = selectedDrinks;
      document.getElementById('baristaPin').value = '';
      document.getElementById('baristaModal').classList.add('active');
    }

    function closeBaristaModal() {
      document.getElementById('baristaModal').classList.remove('active');
    }

    function adjustCount(amount) {
      selectedDrinks = Math.max(1, Math.min(MAX_STAMPS - currentStamps, selectedDrinks + amount));
      document.getElementById('drinkCount').textContent = selectedDrinks;
    }

    function confirmStamps() {
      const pin = document.getElementById('baristaPin').value;

      if (pin !== DEFAULT_PIN) {
        alert("Incorrect Barista Password! Please try again.");
        return;
      }

      currentStamps = Math.min(MAX_STAMPS, currentStamps + selectedDrinks);
      renderStamps();
      closeBaristaModal();

      if (currentStamps === MAX_STAMPS) {
        setTimeout(() => {
          alert("🎉 Congratulations! You have completed 10 stamps. Redeem your free Hot/Iced Coffee or Matcha Series drink!");
        }, 300);
      }
    }

    function resetCard() {
      if (confirm("Reset card progress?")) {
        currentStamps = 0;
        renderStamps();
      }
    }

    renderStamps();
  </script>
</body>
</html>
